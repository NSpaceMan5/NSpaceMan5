  <g fill="#4a7a2c">
    <rect x="90" y="500" width="6" height="4"/>
    <rect x="108" y="528" width="6" height="4"/>
    <rect x="116" y="514" width="6" height="4"/>
    <rect x="236" y="518" width="6" height="4"/>
    <rect x="250" y="502" width="6" height="4"/>
  </g>
  <g fill="#375c20">
    <rect x="150" y="440" width="4" height="180"/>
    <rect x="144" y="452" width="16" height="3"/>
    <rect x="144" y="492" width="16" height="3"/>
    <rect x="144" y="532" width="16" height="3"/>
    <rect x="144" y="572" width="16" height="3"/>
    <rect x="200" y="470" width="4" height="160"/>
    <rect x="194" y="482" width="16" height="3"/>
    <rect x="194" y="522" width="16" height="3"/>
    <rect x="194" y="562" width="16" height="3"/>
  </g>

  <!-- Swamp water surface -->
  <rect x="0" y="580" width="800" height="160" fill="#0f1e14"/>
  <rect x="0" y="580" width="800" height="3" fill="#2e5a3e"/>

  <!-- Reflections -->
  <rect x="30" y="610" width="80" height="2" fill="#39ff14" opacity="0.25">
    <animate attributeName="opacity" values="0.15;0.35;0.15" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="100" y="640" width="60" height="2" fill="#39ff14" opacity="0.2">
    <animate attributeName="opacity" values="0.35;0.15;0.35" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="20" y="670" width="70" height="2" fill="#00ffd5" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Bubbles (muncul dari seam) -->
  <use href="#bubble" x="120" y="650">
    <animate attributeName="y" values="650;480" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="120;126;120" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="6s" repeatCount="indefinite"/>
  </use>
  <use href="#bubble" x="280" y="590">
    <animate attributeName="y" values="590;440" dur="7s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="x" values="280;274;280" dur="7s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="7s" begin="1s" repeatCount="indefinite"/>
  </use>
  <use href="#bubble" x="180" y="630">
    <animate attributeName="y" values="630;450" dur="5s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="5s" begin="2s" repeatCount="indefinite"/>
  </use>

  <!-- Fireflies -->
  <g>
    <use href="#firefly" x="180" y="380">
      <animate attributeName="x" values="180;220;180" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="380;360;380" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </use>
    <use href="#firefly" x="360" y="320">
      <animate attributeName="x" values="360;330;360" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="y" values="320;300;320" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="2.7s" repeatCount="indefinite"/>
    </use>
    <use href="#firefly" x="520" y="420">
      <animate attributeName="x" values="520;560;520" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="y" values="420;396;420" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite"/>
    </use>
    <use href="#firefly" x="640" y="360">
      <animate attributeName="x" values="640;610;640" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="y" values="360;336;360" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/>
    </use>
    <use href="#firefly" x="260" y="500">
      <animate attributeName="x" values="260;300;260" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="y" values="500;478;500" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/>
    </use>
    <use href="#firefly" x="400" y="500">
      <animate attributeName="x" values="400;370;400" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="500;480;500" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.8s" repeatCount="indefinite"/>
    </use>
  </g>
</g>

