<!-- Carnivorous plant: batang & daun STATIS, hanya kepala yang sway -->
<g transform="translate(240, 600)">

  <!-- Batang (statis, menancap di air/tanah) -->
  <g fill="#3f6a26">
    <rect x="-3" y="-110" width="6" height="110"/>
  </g>
  <g fill="#2a4a1a">
    <rect x="-3" y="-110" width="2" height="110"/>
  </g>

  <!-- Daun (statis) -->
  <g fill="#4a7a2c">
    <rect x="3" y="-80" width="20" height="4"/>
    <rect x="23" y="-84" width="4" height="8"/>
    <rect x="-23" y="-60" width="20" height="4"/>
    <rect x="-27" y="-64" width="4" height="8"/>
    <rect x="3" y="-30" width="16" height="4"/>
    <rect x="19" y="-34" width="4" height="8"/>
  </g>

  <!-- Kepala (hanya ini yang bergerak, pivot di puncak batang) -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-2 0 -110; 2 0 -110; -2 0 -110"
      dur="4s" repeatCount="indefinite"/>
    <g transform="translate(0, -110)">

      <!-- Upper jaw -->
      <g fill="#5a8a34">
        <rect x="-32" y="-14" width="64" height="14"/>
        <rect x="-28" y="-18" width="56" height="4"/>
        <rect x="-24" y="-22" width="48" height="4"/>
      </g>
      <g fill="#c8e8a0">
        <rect x="-28" y="-2" width="3" height="8"/>
        <rect x="-20" y="-2" width="3" height="8"/>
        <rect x="-12" y="-2" width="3" height="8"/>
        <rect x="-4"  y="-2" width="3" height="8"/>
        <rect x="4"   y="-2" width="3" height="8"/>
        <rect x="12"  y="-2" width="3" height="8"/>
        <rect x="20"  y="-2" width="3" height="8"/>
      </g>
      <rect x="-2" y="-14" width="4" height="14" fill="#2a4a1a"/>

      <!-- Lower jaw (membuka-menutup pelan) -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0 -32 0; -8 -32 0; 0 -32 0"
          dur="3s" repeatCount="indefinite"/>
        <g transform="translate(-32,0)" fill="#4a7a2c">
          <rect x="0" y="0" width="64" height="14"/>
          <rect x="4" y="14" width="56" height="4"/>
          <rect x="8" y="18" width="48" height="4"/>
        </g>
        <g transform="translate(-32,0)" fill="#c8e8a0">
          <rect x="4"  y="-6" width="3" height="8"/>
          <rect x="12" y="-6" width="3" height="8"/>
          <rect x="20" y="-6" width="3" height="8"/>
          <rect x="28" y="-6" width="3" height="8"/>
          <rect x="36" y="-6" width="3" height="8"/>
          <rect x="44" y="-6" width="3" height="8"/>
          <rect x="52" y="-6" width="3" height="8"/>
        </g>
        <rect x="-24" y="4" width="48" height="6" fill="#3a0a1a" opacity="0.9"/>
        <rect x="-16" y="6" width="32" height="4" fill="#ff00aa" opacity="0.35">
          <animate attributeName="opacity" values="0.15;0.5;0.15" dur="3s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
</g>

