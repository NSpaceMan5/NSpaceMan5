<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" shape-rendering="crispEdges" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="swampGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1410"/>
      <stop offset="0.6" stop-color="#0f2418"/>
      <stop offset="1" stop-color="#08120c"/>
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1a2e"/>
      <stop offset="0.5" stop-color="#0c2440"/>
      <stop offset="1" stop-color="#040a14"/>
    </linearGradient>
    <radialGradient id="nameGlowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    /* === 4 phases: 4s / 6s / 8s / 12s — non-uniform loop === */
    .ammonite { animation: swim 8s cubic-bezier(0.5, 0, 0.5, 1) infinite; transform-origin: 600px 260px; }
    @keyframes swim {
      0%   { transform: translate(0, 0) rotate(0deg); }
      20%  { transform: translate(-8px, -4px) rotate(-3deg); }
      45%  { transform: translate(18px, 0) rotate(6deg); }
      65%  { transform: translate(28px, 3px) rotate(3deg); }
      85%  { transform: translate(10px, -2px) rotate(-2deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
    .tentacle { animation: wave 2s ease-in-out infinite; transform-origin: center top; }
    .tentacle.t2 { animation-delay: -0.4s; }
    .tentacle.t3 { animation-delay: -0.8s; }
    .tentacle.t4 { animation-delay: -1.2s; }
    @keyframes wave {
      0%,100% { transform: scaleY(1) skewX(0deg); }
      50%     { transform: scaleY(0.85) skewX(3deg); }
    }
    .trail { animation: fadeTrail 8s linear infinite; }
    @keyframes fadeTrail {
      0%,100% { opacity: 0; }
      10%     { opacity: 0.8; }
      80%     { opacity: 0.4; }
    }

    .flytrap-body { animation: sway 4s ease-in-out infinite; transform-origin: 100px 320px; }
    @keyframes sway {
      0%,100% { transform: rotate(-1.5deg); }
      50%     { transform: rotate(1.5deg); }
    }
    .upper-lobe { animation: snap 6s cubic-bezier(0.6, 0, 0.4, 1) infinite; transform-origin: 100px 300px; }
    @keyframes snap {
      0%, 55%, 100% { transform: rotate(0deg); }
      62%           { transform: rotate(-18deg); }
      70%           { transform: rotate(2deg); }
      78%           { transform: rotate(0deg); }
    }
    .trap-inner { animation: breathe 3s ease-in-out infinite; }
    @keyframes breathe {
      0%,100% { fill: #dc2626; }
      50%     { fill: #991b1b; }
    }

    .bubble { animation: rise 6s linear infinite; }
    .bubble.b2 { animation-delay: -1.5s; }
    .bubble.b3 { animation-delay: -3s; }
    .bubble.b4 { animation-delay: -4.5s; }
    @keyframes rise {
      0%   { transform: translateY(0); opacity: 0; }
      10%  { opacity: 0.85; }
      90%  { opacity: 0.85; }
      100% { transform: translateY(-120px); opacity: 0; }
    }

    .fog { animation: drift 12s linear infinite; }
    @keyframes drift {
      0%   { transform: translateX(-30px); opacity: 0.08; }
      50%  { opacity: 0.18; }
      100% { transform: translateX(30px); opacity: 0.08; }
    }

    .plankton { animation: pdrift 10s ease-in-out infinite; }
    .plankton.p2 { animation-delay: -3s; }
    .plankton.p3 { animation-delay: -6s; }
    @keyframes pdrift {
      0%,100% { transform: translate(0, 0); opacity: 0.6; }
      50%     { transform: translate(12px, -8px); opacity: 1; }
    }

    .name-glow { animation: npulse 4s ease-in-out infinite; }
    @keyframes npulse {
      0%,100% { filter: drop-shadow(0 0 2px #22d3ee); }
      50%     { filter: drop-shadow(0 0 6px #22d3ee) drop-shadow(0 0 12px #e879f9); }
    }

    .scanline { animation: scanmove 8s linear infinite; opacity: 0.06; }
    @keyframes scanmove {
      0%   { transform: translateY(0); }
      100% { transform: translateY(4px); }
    }

    .crt-flick { animation: flick 4s steps(20) infinite; }
    @keyframes flick {
      0%,92%,100% { opacity: 1; }
      94%         { opacity: 0.85; }
      96%         { opacity: 1; }
      98%         { opacity: 0.92; }
    }

    .firefly { animation: ffly 5s ease-in-out infinite; }
    .firefly.f2 { animation-delay: -1.5s; }
    .firefly.f3 { animation-delay: -3s; }
    @keyframes ffly {
      0%,100% { opacity: 0.3; transform: translate(0,0); }
      30%     { opacity: 1; transform: translate(4px,-6px); }
      60%     { opacity: 0.7; transform: translate(-3px,-2px); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- ================= BACKGROUND ================= -->
  <rect width="800" height="400" fill="#050a08"/>
  <rect width="800" height="400" fill="url(#swampGrad)"/>
  <polygon points="520,0 800,0 800,400 240,400" fill="url(#oceanGrad)"/>
  <line x1="520" y1="0" x2="240" y2="400" stroke="#22d3ee" stroke-width="1" opacity="0.25"/>
  <line x1="521" y1="0" x2="241" y2="400" stroke="#e879f9" stroke-width="1" opacity="0.12"/>

  <!-- ================= SWAMP (left/top) ================= -->
  <!-- Giant tree silhouette -->
  <g fill="#0a1a10">
    <rect x="30" y="40" width="18" height="240"/>
    <rect x="18" y="80" width="12" height="20"/>
    <rect x="48" y="100" width="14" height="16"/>
    <rect x="24" y="60" width="60" height="6"/>
    <rect x="10" y="90" width="70" height="4"/>
  </g>
  <!-- Ancient ferns -->
  <g fill="#12261a">
    <rect x="180" y="180" width="3" height="120"/>
    <rect x="168" y="200" width="14" height="3"/>
    <rect x="184" y="220" width="16" height="3"/>
    <rect x="166" y="240" width="14" height="3"/>
    <rect x="184" y="260" width="16" height="3"/>

    <rect x="220" y="220" width="2" height="80"/>
    <rect x="212" y="235" width="10" height="2"/>
    <rect x="224" y="255" width="10" height="2"/>
  </g>
  <!-- Swamp water -->
  <rect x="0" y="320" width="500" height="80" fill="#071610" opacity="0.9"/>
  <g fill="#22d3ee" opacity="0.15">
    <rect x="60" y="330" width="80" height="1"/>
    <rect x="200" y="345" width="100" height="1"/>
    <rect x="340" y="335" width="70" height="1"/>
    <rect x="120" y="360" width="90" height="1"/>
  </g>
  <!-- Fog -->
  <g class="fog" fill="#22d3ee">
    <rect x="20" y="240" width="200" height="40" opacity="0.15"/>
    <rect x="180" y="270" width="180" height="30" opacity="0.1"/>
  </g>
  <!-- Fireflies -->
  <g fill="#4ade80">
    <rect class="firefly" x="140" y="200" width="2" height="2"/>
    <rect class="firefly f2" x="260" y="170" width="2" height="2"/>
    <rect class="firefly f3" x="90" y="250" width="2" height="2"/>
  </g>
  <!-- Bubbles -->
  <g fill="#4ade80">
    <rect class="bubble"    x="80"  y="350" width="4" height="4"/>
    <rect class="bubble b2" x="180" y="355" width="3" height="3"/>
    <rect class="bubble b3" x="280" y="348" width="5" height="5"/>
    <rect class="bubble b4" x="380" y="360" width="3" height="3"/>
  </g>

  <!-- ================= OCEAN (right/bottom) ================= -->
  <!-- Light rays from top -->
  <g fill="#22d3ee" opacity="0.06">
    <polygon points="560,0 590,0 620,400 570,400"/>
    <polygon points="640,0 660,0 700,400 660,400"/>
    <polygon points="720,0 735,0 770,400 740,400"/>
  </g>
  <!-- Coral / sponges -->
  <g fill="#166534" opacity="0.75">
    <rect x="540" y="320" width="3" height="60"/>
    <rect x="535" y="330" width="12" height="3"/>
    <rect x="540" y="348" width="10" height="3"/>
    <rect x="540" y="368" width="12" height="3"/>

    <rect x="700" y="300" width="3" height="80"/>
    <rect x="693" y="315" width="14" height="3"/>
    <rect x="700" y="340" width="14" height="3"/>
    <rect x="693" y="365" width="14" height="3"/>
  </g>
  <g fill="#0891b2" opacity="0.5">
    <rect x="620" y="360" width="2" height="30"/>
    <rect x="616" y="368" width="10" height="2"/>
  </g>
  <!-- Plankton -->
  <g fill="#22d3ee">
    <rect class="plankton"    x="580" y="200" width="2" height="2"/>
    <rect class="plankton p2" x="660" y="240" width="2" height="2"/>
    <rect class="plankton p3" x="720" y="180" width="2" height="2"/>
    <rect class="plankton"    x="700" y="290" width="2" height="2"/>
    <rect class="plankton p2" x="550" y="270" width="2" height="2"/>
  </g>

  <!-- ================= AMMONITE (right, protagonist) ================= -->
  <g class="ammonite">
    <!-- Trail -->
    <g class="trail" fill="#22d3ee">
      <rect x="605" y="270" width="2" height="2" opacity="0.7"/>
      <rect x="595" y="265" width="2" height="2" opacity="0.5"/>
      <rect x="582" y="262" width="2" height="2" opacity="0.3"/>
    </g>
    <!-- Tentacles -->
    <g fill="#d4a373">
      <rect class="tentacle"    x="570" y="250" width="2" height="14"/>
      <rect class="tentacle t2" x="576" y="248" width="2" height="16"/>
      <rect class="tentacle t3" x="582" y="250" width="2" height="14"/>
      <rect class="tentacle t4" x="588" y="252" width="2" height="12"/>
    </g>
    <!-- Shell -->
    <g fill="#4a4032">
      <rect x="596" y="240" width="44" height="44"/>
      <rect x="602" y="234" width="32" height="56"/>
      <rect x="588" y="250" width="60" height="24"/>
    </g>
    <!-- Shell spiral (bone) -->
    <g fill="#e8e0d5">
      <rect x="602" y="258" width="36" height="2"/>
      <rect x="608" y="248" width="24" height="2"/>
      <rect x="612" y="240" width="18" height="2"/>
      <rect x="618" y="270" width="16" height="2"/>
      <rect x="612" y="278" width="24" height="2"/>
      <rect x="606" y="266" width="4" height="4"/>
      <rect x="624" y="256" width="4" height="4"/>
    </g>
    <!-- Amber center -->
    <rect x="624" y="264" width="6" height="6" fill="#d4a373"/>
    <rect x="626" y="266" width="2" height="2" fill="#fbbf24"/>
  </g>

  <!-- ================= VENUS FLYTRAP (left, anchor) ================= -->
  <g class="flytrap-body">
    <!-- Stem -->
    <rect x="98" y="320" width="4" height="60" fill="#2d4623"/>
    <rect x="92" y="378" width="16" height="3" fill="#2d4623"/>

    <!-- Lower lobe -->
    <rect x="70" y="296" width="60" height="26" fill="#166534"/>
    <rect x="74" y="292" width="52" height="30" fill="#22c55e"/>
    <rect x="82" y="302" width="36" height="5" fill="#dc2626"/>
    <rect class="trap-inner" x="84" y="304" width="32" height="3"/>
    <!-- Lower teeth -->
    <g fill="#e8e0d5">
      <rect x="72" y="290" width="4" height="4"/>
      <rect x="84" y="290" width="4" height="4"/>
      <rect x="96" y="290" width="4" height="4"/>
      <rect x="108" y="290" width="4" height="4"/>
      <rect x="120" y="290" width="4" height="4"/>
    </g>

    <!-- Upper lobe (animated) -->
    <g class="upper-lobe">
      <rect x="70" y="266" width="60" height="24" fill="#166534"/>
      <rect x="74" y="262" width="52" height="28" fill="#22c55e"/>
      <rect x="82" y="272" width="36" height="5" fill="#dc2626"/>
      <rect class="trap-inner" x="84" y="274" width="32" height="3"/>
      <g fill="#e8e0d5">
        <rect x="72" y="288" width="4" height="4"/>
        <rect x="84" y="288" width="4" height="4"/>
        <rect x="96" y="288" width="4" height="4"/>
        <rect x="108" y="288" width="4" height="4"/>
        <rect x="120" y="288" width="4" height="4"/>
      </g>
    </g>
  </g>

  <!-- ================= FOSSIL ANCHOR (center bottom) ================= -->
  <g>
    <rect x="360" y="360" width="120" height="30" fill="#4a4032"/>
    <rect x="354" y="368" width="132" height="14" fill="#3d3428"/>
    <g fill="#e8e0d5" opacity="0.7">
      <rect x="370" y="372" width="4" height="4"/>
      <rect x="386" y="374" width="4" height="4"/>
      <rect x="402" y="372" width="4" height="4"/>
      <rect x="418" y="374" width="4" height="4"/>
      <rect x="434" y="372" width="4" height="4"/>
      <rect x="450" y="374" width="4" height="4"/>
    </g>
    <g fill="#d4a373" opacity="0.4">
      <rect x="378" y="380" width="2" height="2"/>
      <rect x="410" y="382" width="2" height="2"/>
      <rect x="440" y="380" width="2" height="2"/>
    </g>
  </g>

  <!-- ================= NAME (top center, high contrast) ================= -->
  <ellipse cx="400" cy="90" rx="240" ry="70" fill="url(#nameGlowGrad)"/>

  <g class="crt-flick">
    <text
      class="name-glow"
      x="400" y="100"
      text-anchor="middle"
      font-size="44"
      font-weight="300"
      fill="#e8f0f5"
      letter-spacing="10"
      font-family="'Courier New', monospace"
    >VYNJUSTHUMANT</text>
  </g>

  <!-- Chromatic aberration ghost (thin) -->
  <text
    x="401.5" y="100"
    text-anchor="middle"
    font-size="44"
    font-weight="300"
    fill="#e879f9"
    letter-spacing="10"
    font-family="'Courier New', monospace"
    opacity="0.18"
    pointer-events="none"
  >VYNJUSTHUMANT</text>
  <text
    x="398.5" y="100"
    text-anchor="middle"
    font-size="44"
    font-weight="300"
    fill="#22d3ee"
    letter-spacing="10"
    font-family="'Courier New', monospace"
    opacity="0.18"
    pointer-events="none"
  >VYNJUSTHUMANT</text>

  <text
    x="400" y="128"
    text-anchor="middle"
    font-size="12"
    fill="#22d3ee"
    letter-spacing="8"
    font-family="'Courier New', monospace"
    opacity="0.85"
  >ML INFRASTRUCTURE · PYTORCH</text>

  <rect x="330" y="142" width="140" height="1" fill="#d4a373" opacity="0.6"/>

  <!-- ================= SCANLINES OVERLAY ================= -->
  <g class="scanline" fill="#22d3ee">
    <rect y="0" width="800" height="1"/>
    <rect y="4" width="800" height="1"/>
    <rect y="8" width="800" height="1"/>
    <rect y="12" width="800" height="1"/>
    <rect y="16" width="800" height="1"/>
    <rect y="20" width="800" height="1"/>
    <rect y="24" width="800" height="1"/>
    <rect y="28" width="800" height="1"/>
    <rect y="32" width="800" height="1"/>
    <rect y="36" width="800" height="1"/>
    <rect y="40" width="800" height="1"/>
    <rect y="44" width="800" height="1"/>
    <rect y="48" width="800" height="1"/>
    <rect y="52" width="800" height="1"/>
    <rect y="56" width="800" height="1"/>
    <rect y="60" width="800" height="1"/>
  </g>

  <!-- Vignette -->
  <rect width="800" height="8" fill="#000" opacity="0.5"/>
  <rect y="392" width="800" height="8" fill="#000" opacity="0.5"/>
</svg>
