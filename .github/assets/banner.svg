<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" shape-rendering="crispEdges" font-family="monospace">
  <style>
    .ammonite { animation: swim 7s ease-in-out infinite; transform-origin: 300px 120px; }
    @keyframes swim {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      30% { transform: translate(15px, -6px) rotate(6deg); }
      60% { transform: translate(25px, 4px) rotate(-6deg); }
    }
    .upper-lobe { animation: snap 6s cubic-bezier(0.6, 0, 0.4, 1) infinite; transform-origin: 50px 140px; }
    @keyframes snap {
      0%, 60%, 100% { transform: rotate(0deg); }
      70% { transform: rotate(-25deg); }
      80% { transform: rotate(0deg); }
    }
    .trap-inner { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { fill: #dc2626; } 50% { fill: #991b1b; } }
    .bubble { animation: rise 6s linear infinite; }
    .bubble.b2 { animation-delay: -2s; }
    .bubble.b3 { animation-delay: -4s; }
    @keyframes rise {
      0% { transform: translateY(0); opacity: 0.8; }
      100% { transform: translateY(-80px); opacity: 0; }
    }
    .name-glow { animation: npulse 3.5s ease-in-out infinite; }
    @keyframes npulse {
      0%,100% { filter: drop-shadow(0 0 2px #22c55e); }
      50% { filter: drop-shadow(0 0 5px #22c55e); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- Background -->
  <rect width="400" height="200" fill="#0a1410"/>
  <polygon points="240,0 400,0 400,200 130,200" fill="#0a1424"/>
  <line x1="240" y1="0" x2="130" y2="200" stroke="#22c55e" stroke-width="1" opacity="0.3"/>

  <!-- Ancient ferns (left) -->
  <g fill="#0f2418">
    <rect x="20" y="120" width="2" height="40"/>
    <rect x="14" y="128" width="8" height="2"/>
    <rect x="22" y="138" width="10" height="2"/>

    <rect x="90" y="100" width="2" height="60"/>
    <rect x="84" y="112" width="8" height="2"/>
    <rect x="92" y="125" width="10" height="2"/>
    <rect x="82" y="138" width="10" height="2"/>
  </g>

  <!-- Swamp water -->
  <rect x="0" y="160" width="250" height="40" fill="#0d1a12"/>

  <!-- Bubbles -->
  <g fill="#4ade80">
    <rect class="bubble" x="60" y="155" width="3" height="3"/>
    <rect class="bubble b2" x="120" y="160" width="2" height="2"/>
    <rect class="bubble b3" x="180" y="158" width="3" height="3"/>
  </g>

  <!-- Venus flytrap -->
  <g>
    <rect x="48" y="145" width="3" height="20" fill="#2d4623"/>
    <rect x="46" y="162" width="7" height="2" fill="#2d4623"/>

    <!-- Lower lobe -->
    <rect x="35" y="135" width="28" height="12" fill="#166534"/>
    <rect x="37" y="132" width="24" height="14" fill="#22c55e"/>
    <rect x="42" y="138" width="14" height="2" fill="#dc2626"/>

    <!-- Lower teeth -->
    <g fill="#e8e0d5">
      <rect x="36" y="130" width="2" height="2"/>
      <rect x="42" y="130" width="2" height="2"/>
      <rect x="48" y="130" width="2" height="2"/>
      <rect x="54" y="130" width="2" height="2"/>
      <rect x="60" y="130" width="2" height="2"/>
    </g>

    <!-- Upper lobe (animated) -->
    <g class="upper-lobe">
      <rect x="35" y="122" width="28" height="10" fill="#166534"/>
      <rect x="37" y="119" width="24" height="12" fill="#22c55e"/>
      <rect x="42" y="124" width="14" height="2" fill="#dc2626"/>
      <g fill="#e8e0d5">
        <rect x="36" y="129" width="2" height="2"/>
        <rect x="42" y="129" width="2" height="2"/>
        <rect x="48" y="129" width="2" height="2"/>
        <rect x="54" y="129" width="2" height="2"/>
        <rect x="60" y="129" width="2" height="2"/>
      </g>
    </g>
  </g>

  <!-- Ammonite (right, animated) -->
  <g class="ammonite">
    <!-- Shell -->
    <g fill="#4a4032">
      <rect x="290" y="105" width="22" height="22"/>
      <rect x="293" y="102" width="16" height="28"/>
      <rect x="287" y="110" width="28" height="12"/>
    </g>
    <!-- Spiral -->
    <g fill="#e8e0d5">
      <rect x="294" y="114" width="16" height="1"/>
      <rect x="297" y="109" width="10" height="1"/>
      <rect x="299" y="105" width="6" height="1"/>
      <rect x="303" y="121" width="7" height="1"/>
    </g>
    <!-- Amber center -->
    <rect x="303" y="115" width="3" height="3" fill="#d4a373"/>
  </g>

  <!-- Seaweed (right) -->
  <g fill="#166534" opacity="0.7">
    <rect x="270" y="170" width="2" height="25"/>
    <rect x="268" y="175" width="6" height="2"/>
    <rect x="355" y="165" width="2" height="30"/>
    <rect x="353" y="175" width="6" height="2"/>
    <rect x="355" y="188" width="6" height="2"/>
  </g>

  <!-- Plankton dots -->
  <g fill="#22c55e" opacity="0.5">
    <rect x="260" y="140" width="1" height="1"/>
    <rect x="340" y="155" width="1" height="1"/>
    <rect x="380" y="145" width="1" height="1"/>
    <rect x="330" y="170" width="1" height="1"/>
  </g>

  <!-- Fossil stone (bottom center) -->
  <g fill="#4a4032" opacity="0.85">
    <rect x="180" y="180" width="40" height="10"/>
    <rect x="177" y="183" width="46" height="5"/>
  </g>
  <g fill="#e8e0d5" opacity="0.6">
    <rect x="185" y="185" width="2" height="2"/>
    <rect x="195" y="186" width="2" height="2"/>
    <rect x="205" y="185" width="2" height="2"/>
    <rect x="213" y="186" width="2" height="2"/>
  </g>

  <!-- Name -->
  <text class="name-glow" x="200" y="55" text-anchor="middle" font-size="20" font-weight="300" fill="#e8e0d5" letter-spacing="4" font-family="'Courier New', monospace">VYNJUSTHUMANT</text>
  <text x="200" y="70" text-anchor="middle" font-size="7" fill="#22c55e" letter-spacing="3" font-family="'Courier New', monospace" opacity="0.85">ML INFRASTRUCTURE · PYTORCH</text>
  <rect x="160" y="76" width="80" height="1" fill="#d4a373" opacity="0.6"/>
</svg>
