<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="180" height="180" shape-rendering="crispEdges">
  <style>
    .upper-lobe {
      animation: snap 5s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      transform-origin: 10px 10px;
    }
    @keyframes snap {
      0%, 55%, 100% { transform: rotate(0deg); }
      65% { transform: rotate(-22deg); }
      75% { transform: rotate(0deg); }
    }
    .trap-inner {
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { fill: #dc2626; }
      50% { fill: #991b1b; }
    }
  </style>

  <!-- Stem -->
  <rect x="9" y="13" width="2" height="6" fill="#2d4623"/>
  <rect x="8" y="19" width="4" height="1" fill="#2d4623"/>

  <!-- Lower lobe -->
  <rect x="4" y="10" width="12" height="4" fill="#166534"/>
  <rect x="5" y="9" width="10" height="5" fill="#22c55e"/>
  <rect class="trap-inner" x="6" y="11" width="8" height="1" fill="#dc2626"/>
  <!-- Lower teeth -->
  <rect x="4" y="8" width="1" height="1" fill="#e8e0d5"/>
  <rect x="6" y="8" width="1" height="1" fill="#e8e0d5"/>
  <rect x="8" y="8" width="1" height="1" fill="#e8e0d5"/>
  <rect x="10" y="8" width="1" height="1" fill="#e8e0d5"/>
  <rect x="12" y="8" width="1" height="1" fill="#e8e0d5"/>
  <rect x="14" y="8" width="1" height="1" fill="#e8e0d5"/>

  <!-- Upper lobe (animated) -->
  <g class="upper-lobe">
    <rect x="4" y="5" width="12" height="4" fill="#166534"/>
    <rect x="5" y="4" width="10" height="5" fill="#22c55e"/>
    <rect class="trap-inner" x="6" y="6" width="8" height="1" fill="#dc2626"/>
    <!-- Upper teeth -->
    <rect x="4" y="9" width="1" height="1" fill="#e8e0d5"/>
    <rect x="6" y="9" width="1" height="1" fill="#e8e0d5"/>
    <rect x="8" y="9" width="1" height="1" fill="#e8e0d5"/>
    <rect x="10" y="9" width="1" height="1" fill="#e8e0d5"/>
    <rect x="12" y="9" width="1" height="1" fill="#e8e0d5"/>
    <rect x="14" y="9" width="1" height="1" fill="#e8e0d5"/>
  </g>
</svg>
