<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="180" height="180" shape-rendering="crispEdges">
  <style>
    .ammonite {
      animation: breathe 8s ease-in-out infinite;
      transform-origin: 10px 10px;
    }
    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.82; }
    }
  </style>

  <g class="ammonite">
    <!-- Outer shell -->
    <rect x="3" y="8" width="14" height="4" fill="#4a4032"/>
    <rect x="4" y="6" width="12" height="8" fill="#4a4032"/>
    <rect x="5" y="5" width="10" height="10" fill="#4a4032"/>
    <rect x="6" y="4" width="8" height="12" fill="#4a4032"/>

    <!-- Bone spiral -->
    <rect x="4" y="9" width="12" height="1" fill="#e8e0d5"/>
    <rect x="5" y="12" width="1" height="1" fill="#e8e0d5"/>
    <rect x="6" y="7" width="8" height="1" fill="#e8e0d5"/>
    <rect x="9" y="6" width="4" height="1" fill="#e8e0d5"/>
    <rect x="12" y="10" width="1" height="1" fill="#e8e0d5"/>
    <rect x="7" y="11" width="1" height="1" fill="#e8e0d5"/>

    <!-- Amber center -->
    <rect x="9" y="8" width="2" height="2" fill="#d4a373"/>

    <!-- Amber accent -->
    <rect x="5" y="8" width="1" height="1" fill="#d4a373"/>
    <rect x="14" y="11" width="1" height="1" fill="#d4a373"/>
  </g>
</svg>
