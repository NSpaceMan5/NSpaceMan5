<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>VynJustHuman — Paleo/Future</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stage" data-parallax-root>
    <div class="layer" data-depth="0.10" style="background-image:url('../assets/banner-static.svg');background-size:cover"></div>
    <div class="layer fog" data-depth="0.25"></div>
    <div class="layer fern" data-depth="0.40"></div>
    <div class="layer ammonite" data-depth="0.65">
      <img src="../assets/banner-static.svg" alt="Ammonite fossil" />
    </div>
    <div class="layer carnivora" data-depth="0.85">
      <img src="../assets/banner-static.svg" alt="Carnivorous plant" />
    </div>
  </div>

  <main class="content">
    <h1 class="reveal">VYNJUSTHUMAN</h1>
    <p class="reveal">⟢ PALEO // FUTURE ⟣</p>
    <p class="reveal">A pixel world where the swamp breathes neon<br/>and the ocean remembers fossils.</p>

    <button id="soundToggle" aria-pressed="false">🔊 ambient: off</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
